name: Deploy demo console

# Publishes the console to GitHub Pages so sales engineers have a permanent
# URL to open, with no install and no local Node.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Verify the Evidence Pack signer
        run: npm run test:hash

      - name: Build the standalone single-file console
        run: npm run build:standalone

      # Ship the standalone build alongside the normal one so the Pages site
      # also serves a file anyone can download and run offline.
      - name: Assemble the site
        run: |
          cp dist-standalone/index.html dist/intelligent-flow-console.html
          cp -f dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
